name: CI Tests

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      SECRET_KEY: ci-test-secret-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -v